<!DOCTYPE html>
<html>

<head>

    <title>All URLs</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            padding: 50px 20px;
        }

        .container {
            max-width: 900px;

            margin: auto;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;

            margin-bottom: 30px;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            margin-bottom: 25px;
        }

        th,
        td {
            padding: 14px;

            text-align: left;

            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f1f1;
        }

        td {
            word-break: break-all;
        }

        a {
            color: #222;

            text-decoration: none;

            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .open-link {
            display: inline-block;

            padding: 7px 12px;

            border-radius: 5px;

            background: #222;

            color: white;

            text-decoration: none;
        }

        .open-link:hover {
            background: #444;

            text-decoration: none;
        }

        .delete-button {
            padding: 7px 12px;

            border: none;

            border-radius: 5px;

            background: #d9534f;

            color: white;

            cursor: pointer;

            font-size: 14px;
        }

        .delete-button:hover {
            background: #c9302c;
        }

        .empty {
            text-align: center;

            color: #666;

            padding: 30px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>🔗 All Short URLs</h1>


        {% if urls %}

            <table>

                <tr>
                    <th>Short Code</th>
                    <th>Original URL</th>
                    <th>Open</th>
                    <th>Delete</th>
                </tr>


                {% for short_code, original_url in urls %}

                    <tr>

                        <td>
                            {{ short_code }}
                        </td>


                        <td>
                            {{ original_url }}
                        </td>


                        <td>

                            <a
                                class="open-link"
                                href="/{{ short_code }}"
                            >
                                Open
                            </a>

                        </td>


                        <td>

                            <form
                                method="POST"
                                action="/delete/{{ short_code }}"
                                onsubmit="return confirm('Delete this URL?');"
                            >

                                <button
                                    class="delete-button"
                                    type="submit"
                                >
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                {% endfor %}

            </table>

        {% else %}

            <p class="empty">
                No URLs have been shortened yet.
            </p>

        {% endif %}


        <a class="back" href="/">
            ← Back to URL Shortener
        </a>

    </div>

</body>

</html>
