<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Page Not Found | Todo API</title>
  <style>
    :root {
      --bg: #0a0c12;
      --surface: #141823;
      --surface-2: #1a1f2d;
      --border: #242a3a;
      --border-strong: #31394e;
      --text: #e8ebf3;
      --muted: #9aa3b8;
      --accent: #7c8cff;
      --accent-2: #5eead4;
      --delete: #f87171;
      --get: #4ade80;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(700px 420px at 50% 28%, rgba(124, 140, 255, 0.16), transparent 65%),
        radial-gradient(500px 300px at 85% 90%, rgba(94, 234, 212, 0.07), transparent 65%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: auto, auto, 44px 44px, 44px 44px;
      background-repeat: no-repeat, no-repeat, repeat, repeat;
    }

    a { color: inherit; }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 10px;
    }

    header { padding: 20px 24px; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      letter-spacing: -0.01em;
      text-decoration: none;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0a0c12;
    }
    .brand-mark svg { width: 16px; height: 16px; }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px 20px 56px;
      text-align: center;
    }
    .wrap { width: min(560px, 100%); }

    .code-404 {
      font-size: clamp(6rem, 24vw, 11rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.06em;
      background: linear-gradient(120deg, var(--accent) 5%, var(--accent-2) 95%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 12px 40px rgba(124, 140, 255, 0.28));
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }
    .message {
      color: var(--muted);
      max-width: 440px;
      margin: 0 auto 28px;
      font-size: 1.02rem;
    }

    .terminal {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 32px;
    }
    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
    .terminal-title {
      margin-left: 8px;
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .terminal pre {
      font-family: var(--mono);
      font-size: 0.86rem;
      line-height: 1.75;
      padding: 16px 18px;
      overflow-x: auto;
      color: #d4d9e8;
    }
    .c { color: #7b859d; }
    .m { color: var(--get); font-weight: 700; }
    .err { color: var(--delete); font-weight: 700; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.97rem;
      text-decoration: none;
      color: #0a0c12;
      background: linear-gradient(135deg, var(--accent), #98a4ff);
      transition: transform 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }

    footer {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      border-top: 1px solid var(--border);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>

  <header>
    <a class="brand" href="/" aria-label="Todo API home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      Todo API
    </a>
  </header>

  <main>
    <div class="wrap">
      <p class="code-404" aria-hidden="true">404</p>
      <h1>Page Not Found</h1>
      <p class="message">
        We couldn&rsquo;t find the page you were looking for. It may have moved, or the address might be mistyped.
      </p>

      <div class="terminal" role="img" aria-label="Terminal output showing a request that returned 404 Not Found">
        <div class="terminal-bar" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="terminal-title">response</span>
        </div>
<pre><span class="c"># this route doesn't exist</span>
<span class="m">GET</span> /requested-page
<span class="err">404</span> Not Found</pre>
      </div>

      <a class="btn" href="/">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Back to home
      </a>
    </div>
  </main>

  <footer>Todo REST API &middot; Flask &amp; SQLite</footer>

</body>
</html>
