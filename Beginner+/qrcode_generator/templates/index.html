<!DOCTYPE html>
<html>

<head>
    <title>QR Code Generator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>QR Code Generator</h1>

        <p>Generate a QR code from any text or URL.</p>

        <form method="POST">

            <input
                type="text"
                name="data"
                placeholder="Enter URL or text"
                required
            >

            <button type="submit">
                Generate QR
            </button>

        </form>


        {% if qr_code %}

            <div class="result">

                <h2>Your QR Code</h2>

                <img
                    src="{{ url_for('static', filename=qr_code) }}"
                    alt="Generated QR Code"
                >

                <br>

                <a
                    href="{{ url_for('static', filename=qr_code) }}"
                    download="qr_code.png"
                    class="download-btn"
                >
                    Download QR
                </a>

            </div>

        {% endif %}

    </div>

</body>

</html>
